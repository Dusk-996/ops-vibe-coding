services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ops-inspect-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_PATH: /data/ops_inspect.db
      SSH_KEYS_DIR: /run/ssh_keys
    volumes:
      - ops_inspect_data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_USE_MOCK: "false"
    container_name: ops-inspect-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  ops_inspect_data:
