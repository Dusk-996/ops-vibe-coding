openapi: 3.0.3
info:
  title: 智能服务器巡检与定时邮件推送平台 API
  version: 1.0.0
  description: >
    ops-inspect-demo 后端接口契约。严格区分静态目标/IP 登记导入与主动巡检动态指标；
    所有写操作需 admin Bearer Token，所有响应均携带 op_id 并记录全量审计。
servers:
  - url: /
    description: 同源反向代理（Nginx -> FastAPI）

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: HMAC-Token
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, example: admin }
        password: { type: string, format: password }
    LoginResponse:
      type: object
      required: [token, username, role, smtp_mode]
      properties:
        token: { type: string }
        username: { type: string }
        role: { type: string, enum: [admin, viewer] }
        smtp_mode: { type: string, enum: [smtp, mock] }
    TargetCreate:
      type: object
      required: [host, address, type, vendor, collector_type]
      properties:
        host: { type: string, minLength: 1, maxLength: 128 }
        address: { type: string, minLength: 1, maxLength: 128 }
        type: { type: string, enum: [物理机, 虚拟机, 容器节点] }
        vendor: { type: string, minLength: 1, maxLength: 64 }
        collector_type: { type: string, enum: [ssh, local, mock] }
        ssh_port: { type: integer, minimum: 1, maximum: 65535, nullable: true }
        ssh_user: { type: string, default: "" }
        ssh_credential_ref: { type: string, default: "" }
    TargetItem:
      allOf:
        - $ref: '#/components/schemas/TargetCreate'
        - type: object
          required: [id, probe_status, last_checked_at, probe_error]
          properties:
            id: { type: integer }
            mem_total: { type: number, nullable: true }
            mem_free: { type: number, nullable: true }
            cores: { type: integer, nullable: true }
            cpu: { type: number, nullable: true }
            probe_status:
              type: string
              enum: [PENDING, OK, WARN, HIGH_LOAD, TIMEOUT, UNREACHABLE]
            last_checked_at: { type: string }
            probe_error: { type: string }
    ImportRequest:
      type: object
      required: [format, content]
      properties:
        format: { type: string, enum: [csv, json] }
        content: { type: string, description: "原始 CSV 或 JSON 文本（上限 2MB）" }
        policy: { type: string, enum: [skip, overwrite], default: skip }
    ScheduleConfig:
      type: object
      required: [enabled, push_time, recipients]
      properties:
        enabled: { type: boolean }
        push_time: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$", example: "09:00" }
        recipients:
          type: array
          minItems: 1
          items: { type: string, format: email }
        smtp_mode: { type: string, enum: [smtp, mock], readOnly: true }
    ErrorResponse:
      type: object
      required: [detail, op_id]
      properties:
        detail: { type: string }
        op_id: { type: string }

paths:
  /health:
    get:
      summary: 健康探活接口（免鉴权）
      responses:
        '200':
          description: 服务健康

  /api/auth/login:
    post:
      summary: 用户登录获取 Bearer Token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401':
          description: 账号或密码错误

  /api/auth/me:
    get:
      summary: 获取当前身份与系统模式
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: 当前登录信息 }
        '401': { description: 未认证 }

  /api/targets:
    get:
      summary: 查询纳管目标列表与汇总 KPI（需 viewer/admin 登录）
      security: [{ BearerAuth: [] }]
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: type
          schema: { type: string }
        - in: query
          name: vendor
          schema: { type: string }
        - in: query
          name: collector_type
          schema: { type: string, enum: [ssh, local, mock] }
        - in: query
          name: alert_only
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: 目标列表与 KPI 汇总
        '401': { description: 未登录或令牌过期 }
    post:
      summary: 登记单个目标服务器（静态字段，初始状态 PENDING）
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TargetCreate' }
      responses:
        '201': { description: 创建成功 }
        '401': { description: 未登录 }
        '403': { description: viewer 越权 }
        '409': { description: 主机名重复 }

  /api/targets/{target_id}:
    put:
      summary: 更新目标静态连接信息
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: target_id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TargetCreate' }
      responses:
        '200': { description: 更新成功 }
        '401': { description: 未登录 }
        '403': { description: viewer 越权 }
        '404': { description: 目标不存在 }
        '409': { description: 主机名重复 }
    delete:
      summary: 删除目标服务器
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: target_id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: 删除成功 }
        '401': { description: 未登录 }
        '403': { description: viewer 越权 }
        '404': { description: 目标不存在 }

  /api/targets/import/preview:
    post:
      summary: 批量导入预检（不写库）
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportRequest' }
      responses:
        '200': { description: 预检结果（valid_rows / errors / duplicate_count） }
        '401': { description: 未登录 }
        '403': { description: viewer 越权 }
        '413': { description: 内容超过 2MB 限制 }

  /api/targets/import/commit:
    post:
      summary: 批量导入事务提交（新增目标状态为 PENDING）
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportRequest' }
      responses:
        '200': { description: 提交统计（added / updated / skipped / op_id） }
        '401': { description: 未登录 }
        '403': { description: viewer 越权 }

  /api/targets/export:
    get:
      summary: 导出目标连接信息与最新巡检指标（需 viewer/admin 登录，CSV UTF-8 BOM 防公式注入 / JSON）
      security: [{ BearerAuth: [] }]
      parameters:
        - in: query
          name: format
          schema: { type: string, enum: [csv, json], default: csv }
      responses:
        '200': { description: 导出文件流 }
        '401': { description: 未登录或令牌过期 }

  /api/inspect/run:
    post:
      summary: 立即全量主动巡检（5 并发，单台失败隔离）
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: 全量巡检汇总（total / succeeded / failed / items / op_id） }
        '401': { description: 未登录 }
        '403': { description: viewer 越权 }
        '409': { description: 已有全量巡检进行中 }

  /api/inspect/{target_id}:
    post:
      summary: 单台目标立即主动采集检测
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: target_id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: 单台采集成功并返回最新快照 }
        '401': { description: 未登录 }
        '403': { description: viewer 越权 }
        '404': { description: 目标不存在 }
        '504': { description: 采集超时（已记 TIMEOUT 且不自动重试） }

  /api/schedule:
    get:
      summary: 获取每日定时推送配置与当前 SMTP 模式（需 viewer/admin 登录）
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: 定时配置
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduleConfig' }
        '401': { description: 未登录或令牌过期 }
    put:
      summary: 更新每日定时推送配置
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleConfig' }
      responses:
        '200': { description: 保存成功 }
        '401': { description: 未登录 }
        '403': { description: viewer 越权 }

  /api/smtp:
    get:
      summary: 获取脱敏后的发件邮箱通道状态与已保存发件账号列表（需 viewer/admin 登录，永不回显授权码）
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: 脱敏 SMTP 状态与账号存档列表 }
        '401': { description: 未登录或令牌过期 }
    put:
      summary: 管理员新增/更新发件邮箱账号并激活（授权码经 Fernet 主密钥加密存库，免重启生效）
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: 保存并立即热生效 }
        '401': { description: 未登录 }
        '403': { description: viewer 越权 }

  /api/smtp/profiles/{profile_id}/activate:
    post:
      summary: 一键切换当前激活的已保存发件账号（profile_id=0 切回本地模拟收件箱）
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: 切换成功并热生效 }
        '401': { description: 未登录 }
        '403': { description: viewer 越权 }
        '404': { description: 存档不存在 }

  /api/smtp/profiles/{profile_id}:
    delete:
      summary: 删除不再使用的已保存发件邮箱账号
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: 删除成功 }
        '401': { description: 未登录 }
        '403': { description: viewer 越权 }
        '404': { description: 存档不存在 }

  /api/reports/markdown:
    get:
      summary: 获取/下载最新 Markdown 巡检报告（需 viewer/admin 登录）
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Markdown 文本内容
          content:
            text/markdown:
              schema: { type: string }
        '401': { description: 未登录或令牌过期 }

  /api/reports/push:
    post:
      summary: 手动立即推送最新巡检报告（防并发 409，超时 504 不重试）
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: 推送成功 }
        '401': { description: 未登录 }
        '403': { description: viewer 越权 }
        '409': { description: 已有推送进行中（防重锁拦截） }
        '504': { description: SMTP 超时（结果未知，禁止自动重试） }

  /api/outbox:
    get:
      summary: 查看邮件发送记录与本地模拟收件箱（需 viewer/admin 登录）
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: 邮件记录列表 }
        '401': { description: 未登录或令牌过期 }

  /api/audits:
    get:
      summary: 查看全量操作与异常审计日志（需 viewer/admin 登录）
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: 审计日志列表 }
        '401': { description: 未登录或令牌过期 }
